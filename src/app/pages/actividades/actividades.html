<section class="seccion">
  <h2>Actividades y Talleres</h2>
  <p>Estas son las actividades disponibles durante el semestre.</p>

  <div class="lista-actividades">
    @for (actividad of actividades; track actividad.nombre) {
      <article class="tarjeta-actividad">
        <h3>{{ actividad.nombre }}</h3>
        <p>{{ actividad.descripcion }}</p>
        <p class="horario"><strong>Horario:</strong> {{ actividad.horario }}</p>
      </article>
    }
  </div>
</section>
