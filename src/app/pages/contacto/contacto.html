<section class="seccion">
  <h2>Contacto</h2>
  <p>Puede comunicarse con nosotros a traves de los siguientes datos.</p>

  <ul class="datos-contacto">
    <li>
      <span class="etiqueta">Correo electronico</span>
      <span class="dato">{{ correo }}</span>
    </li>
    <li>
      <span class="etiqueta">Telefono</span>
      <span class="dato">{{ telefono }}</span>
    </li>
    <li>
      <span class="etiqueta">Direccion</span>
      <span class="dato">{{ direccion }}</span>
    </li>
    <li>
      <span class="etiqueta">Horario de atencion</span>
      <span class="dato">{{ horario }}</span>
    </li>
  </ul>
</section>
